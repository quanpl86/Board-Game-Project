name: Platform Foundation CI
on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'games/**'
      - 'tools/**'
      - 'infra/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'eslint.config.mjs'
      - 'turbo.json'
      - '.github/workflows/platform-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'games/**'
      - 'tools/**'
      - 'infra/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'eslint.config.mjs'
      - 'turbo.json'
      - '.github/workflows/platform-ci.yml'
permissions:
  contents: read
concurrency:
  group: platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install dependencies — temporary lockfile seed
        run: pnpm install --no-frozen-lockfile
      - name: Lockfile export for bootstrap (public metadata only)
        shell: bash
        run: |
          echo "BGU_LOCK_BEGIN"
          base64 -w0 pnpm-lock.yaml | fold -w200 | sed 's/^/BGU_LOCK_CHUNK:/'
          echo "BGU_LOCK_END"
      - name: Source checks
        run: pnpm lint
      - name: TypeScript
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Build Next.js
        run: pnpm build
