name: Dependency and Secret Security
on:
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'apps/**'
      - 'packages/**'
      - 'games/**'
      - 'infra/**'
      - 'scripts/check_secrets.py'
      - '.github/workflows/security.yml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'apps/**'
      - 'packages/**'
      - 'games/**'
      - 'infra/**'
      - 'scripts/check_secrets.py'
      - '.github/workflows/security.yml'
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependency-and-secret-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Audit production dependency advisories
        run: pnpm security:audit
      - name: Scan tracked source for obvious credentials
        run: python3 scripts/check_secrets.py
