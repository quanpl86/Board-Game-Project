name: P1-D Student and Character Core DB
on:
  pull_request:
    paths:
      - 'db/migrations/0003_student_character_core_candidate.sql'
      - 'db/tests/0003_student_character_core_smoke.sql'
      - 'scripts/check_student_character_core.py'
      - 'docs/database/student-universe/PHYSICAL_CORE_MIGRATION.md'
      - '.github/workflows/database-student-core.yml'
  push:
    branches: [main]
    paths:
      - 'db/migrations/0003_student_character_core_candidate.sql'
      - 'db/tests/0003_student_character_core_smoke.sql'
      - 'scripts/check_student_character_core.py'
      - '.github/workflows/database-student-core.yml'
permissions: {contents: read}
concurrency:
  group: student-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_PASSWORD: ci_only, POSTGRES_USER: postgres, POSTGRES_DB: student_ci}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d student_ci"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: student_ci
      PGUSER: postgres
      PGPASSWORD: ci_only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - name: Validate physical schema against P1 and student manifests
        run: python scripts/check_student_character_core.py
      - name: Install PostgreSQL client if absent
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
      - name: Apply P0 migration on disposable PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f db/migrations/0001_p0_foundation.sql
      - name: Verify P0 negative integrity and RLS tests
        run: psql -X -v ON_ERROR_STOP=1 -f db/tests/0001_p0_smoke.sql
      - name: Apply six student and character core tables
        run: psql -X -v ON_ERROR_STOP=1 -f db/migrations/0003_student_character_core_candidate.sql
      - name: Test identities, guardians, asset approval, immutable ownership and RLS
        run: psql -X -v ON_ERROR_STOP=1 -f db/tests/0003_student_character_core_smoke.sql
# Disposable test DB only, no staging/prod credentials, no application grants.
