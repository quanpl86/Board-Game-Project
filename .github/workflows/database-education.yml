name: P1-A Education PostgreSQL Integrity
on:
  pull_request:
    paths:
      - 'db/migrations/0002_p1a_education_candidate.sql'
      - 'db/tests/0002_p1a_education_smoke.sql'
      - 'docs/database/p1/EDUCATION_PHYSICAL_CANDIDATE.md'
      - 'scripts/check_p1a_education.py'
      - '.github/workflows/database-education.yml'
  push:
    branches: [main]
    paths:
      - 'db/migrations/0002_p1a_education_candidate.sql'
      - 'db/tests/0002_p1a_education_smoke.sql'
      - 'scripts/check_p1a_education.py'
      - '.github/workflows/database-education.yml'
permissions: {contents: read}
concurrency:
  group: p1a-education-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  p1a-education:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_PASSWORD: ci_only, POSTGRES_USER: postgres, POSTGRES_DB: bgu_edu_ci}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d bgu_edu_ci"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: bgu_edu_ci
      PGUSER: postgres
      PGPASSWORD: ci_only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - name: P1-A static migration-schema/RLS parity
        run: python scripts/check_p1a_education.py
      - name: PostgreSQL client availability
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
      - name: Apply P0 migration to disposable database
        run: psql -X -v ON_ERROR_STOP=1 -f db/migrations/0001_p0_foundation.sql
      - name: Check P0 integrity before P1-A migration
        run: psql -X -v ON_ERROR_STOP=1 -f db/tests/0001_p0_smoke.sql
      - name: Apply 11-table Education migration to disposable database
        run: psql -X -v ON_ERROR_STOP=1 -f db/migrations/0002_p1a_education_candidate.sql
      - name: Negative FK/rubric/enrollment/immutability/RLS tests
        run: psql -X -v ON_ERROR_STOP=1 -f db/tests/0002_p1a_education_smoke.sql
# This CI never contacts real KingDragonHub DB or hosts; no deploy/production secret.
